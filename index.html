<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- El tag viewport es esencial para que la pantalla del celular se escale correctamente -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de Diseño Responsive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>Mi Sitio Responsive</h1>
  </header>

  <main class="container">
    <div class="card">
      <h2>Tarjeta 1</h2>
      <p>Contenido explicativo de la primera tarjeta adaptada al dispositivo.</p>
    </div>
    <div class="card">
      <h2>Tarjeta 2</h2>
      <p>Contenido explicativo de la segunda tarjeta adaptada al dispositivo.</p>
    </div>
    <div class="card">
      <h2>Tarjeta 3</h2>
      <p>Contenido explicativo de la tercera tarjeta adaptada al dispositivo.</p>
    </div>
  </main>

</body>
</html>
