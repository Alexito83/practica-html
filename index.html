<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño Responsive Interactivo</title>
  <!-- Aquí llamamos a tu archivo de estilos exacto -->
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header class="header">
    <h1>Cambiador de Color Interactivo</h1>
  </header>

  <main class="container">
    <!-- Tarjeta objetivo -->
    <div class="card" id="miTarjeta">
      <h2 id="tituloCard">Tarjeta Dinámica</h2>
      <p id="textoCard">Haz clic en los botones de abajo para cambiar mis colores.</p>
    </div>

    <!-- Panel de botones (responsive) -->
    <div class="panel-botones">
      <button class="btn btn-turquesa" onclick="cambiarColor('#112b3c', '#00cec9', '#ffffff')">Turquesa</button>
      <button class="btn btn-morado" onclick="cambiarColor('#2a1b3d', '#a29bfe', '#ffffff')">Morado</button>
      <button class="btn btn-naranja" onclick="cambiarColor('#3b2318', '#ff7675', '#ffffff')">Naranja</button>
      <button class="btn btn-reset" onclick="restablecerColor()">Restablecer</button>
    </div>
  </main>

  <!-- Aquí llamamos a tu archivo de JavaScript exacto -->
  <script src="java.js"></script>
</body>
</html>
